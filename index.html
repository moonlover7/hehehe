<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Love Letter 💖</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle, #ffb6c1, #fff);
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
}

body::before {
    content:"";
    position:absolute;
    inset:0;
    background: radial-gradient(circle, rgba(255,105,180,.25), transparent 70%);
    animation: glow 6s infinite alternate;
}

@keyframes glow {
    from { opacity: .3; }
    to   { opacity: .7; }
}

/* Envelope */
.envelope-container {
    position: relative;
    width: 330px;
    height: 230px;
    cursor: pointer;
    z-index: 2;
}

.envelope {
    position: relative;
    width: 100%;
    height: 100%;
    background: linear-gradient(to bottom right, #ffd1dc, #f4a6c1);
    border-radius: 12px;
    box-shadow: 0 15px 35px rgba(0,0,0,.25);
    overflow: hidden;
}

.flap {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, #ff9ebc, #ff6fa1);
    clip-path: polygon(0 0, 50% 55%, 100% 0, 100% 100%, 0 100%);
    transform-origin: top;
    transition: transform 1s ease;
    z-index: 4;
}

.envelope.open .flap { transform: rotateX(180deg); }

/* Letter */
.letter {
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 290px;
    height: 190px;
    background: #fffafc;
    border-radius: 15px;
    transform: translateX(-50%) translateY(130px);
    transition: 1s ease;
    padding: 20px;
    text-align: center;
    z-index: 2;
}

.envelope.open .letter {
    transform: translateX(-50%) translateY(-30px);
}

.letter h2 { margin: 5px 0 10px; color: crimson; }
.letter p { font-size: 15px; line-height: 1.6; color: #444; min-height: 100px; }

.buttons {
    margin-top: 10px;
}

button {
    background: crimson;
    color: #fff;
    border: none;
    padding: 5px 14px;
    border-radius: 10px;
    cursor: pointer;
    margin: 0 8px;
    font-size: 13px;
    transition: 0.3s;
}

button:hover { background: #b3003b; }

/* Rose */
.rose {
    position: absolute;
    right: -110px;
    bottom: 10px;
    opacity: 0;
    transform: scale(.5);
    transition: .9s ease;
}

.envelope.open + .rose {
    opacity: 1;
    transform: scale(1);
}

.bloom {
    position: relative;
    width: 50px;
    height: 50px;
    background: radial-gradient(circle, #ff5c8a, #b3003b);
    border-radius: 50%;
    box-shadow: 0 0 15px rgba(255,0,90,.6);
}

.bloom::before,
.bloom::after {
    content:"";
    position:absolute;
    inset:6px;
    border-radius:50%;
    background: radial-gradient(circle, #ff7aa8, #8a002b);
}

.stem { width:6px; height:140px; background: linear-gradient(to bottom,#2ecc71,#0b5c22); margin:auto; border-radius:10px; }

/* Hint */
.hint {
    position: absolute;
    bottom: -45px;
    width: 100%;
    text-align: center;
    font-size: 13px;
    color: #b3003b;
}

/* Floating hearts */
.heart {
    position: absolute;
    color: hotpink;
    font-size: 18px;
    animation: float 3s linear forwards;
    pointer-events: none;
}

@keyframes float {
    from { transform: translateY(0) scale(1); opacity: 1; }
    to { transform: translateY(-160px) scale(.3); opacity: 0; }
}
</style>
</head>

<body>

<div class="envelope-container" onclick="openEnvelope(event)">
    <div class="envelope" id="env">
        <div class="flap"></div>

        <div class="letter">
            <h2>Agaw🫶</h2>
            <p id="text"></p>
            <div class="buttons">
                <button onclick="prevPage(event)">Prev</button>
                <button onclick="nextPage(event)">Next</button>
            </div>
        </div>
    </div>
    <div class="hint">Click the envelope 💌</div>
</div>

<div class="rose">
    <div class="bloom"></div>
    <div class="stem"></div>
</div>

<script>
const pages = [
"I just want you to know how truly grateful I am for you.",
"Every little thing you do, every smile, every word—it means more to me than I can ever express.",
"You make my life brighter, my days lighter, and my heart fuller.",
"I don’t say it enough, but I appreciate you more than words could ever capture, and I feel so lucky to have you in my life, i love you so much!"
];

let currentPage = 0;
const textEl = document.getElementById("text");

function showPage() {
    textEl.innerHTML = pages[currentPage];
}

function nextPage(e) {
    e.stopPropagation();
    if(currentPage < pages.length -1) { currentPage++; showPage(); }
}

function prevPage(e) {
    e.stopPropagation();
    if(currentPage >0){ currentPage--; showPage(); }
}

function openEnvelope(e) {
    const env = document.getElementById("env");
    env.classList.toggle("open");
    if(env.classList.contains("open")) {
        showPage();
        spawnHearts(e.clientX, e.clientY);
    }
}

function spawnHearts(x,y){
    for(let i=0;i<12;i++){
        const heart = document.createElement("div");
        heart.className="heart";
        heart.innerHTML="❤";
        heart.style.left = x + (Math.random()*40-20) + "px";
        heart.style.top = y + "px";
        document.body.appendChild(heart);
        setTimeout(()=>heart.remove(),3000);
    }
}
</script>

</body>
</html>
